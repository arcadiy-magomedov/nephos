title = "Nephos secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Literal internal job route in documentation/tests, not an API credential"
condition = "AND"
paths = ['''face-inference/README\.md$''', '''tests/Nephos\.Tests/AnalysisTests\.cs$''']
regexTarget = "secret"
regexes = ['''^8080/internal/faces/jobs$''']
