services:
  keycloak:
    command: ["start", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${PUBLIC_HOST:?Set PUBLIC_HOST to your canonical DNS hostname}
      KC_HOSTNAME_ADMIN: ${PRIVATE_KEYCLOAK_URL:-http://localhost:18081}
  library-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Authority: https://${PUBLIC_HOST}/realms/nephos
      Authentication__MetadataAddress: https://${PUBLIC_HOST}/realms/nephos/.well-known/openid-configuration
  library-worker:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Authority: https://${PUBLIC_HOST}/realms/nephos
      Authentication__MetadataAddress: https://${PUBLIC_HOST}/realms/nephos/.well-known/openid-configuration
  library-admin:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Authority: https://${PUBLIC_HOST}/realms/nephos
      Authentication__MetadataAddress: https://${PUBLIC_HOST}/realms/nephos/.well-known/openid-configuration
  storage-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Authority: https://${PUBLIC_HOST}/realms/nephos
      Authentication__MetadataAddress: https://${PUBLIC_HOST}/realms/nephos/.well-known/openid-configuration
  storage-worker:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Authority: https://${PUBLIC_HOST}/realms/nephos
      Authentication__MetadataAddress: https://${PUBLIC_HOST}/realms/nephos/.well-known/openid-configuration
  edge:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    mem_limit: 128m
volumes:
  certificates:
