name: Nephos CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required CI
    needs: [quality, backend, integration, faces, ios, native-qr]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every qualification to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  quality:
    name: Lint and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install checksum-pinned scanners
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/quality-tools"
          cd "$RUNNER_TEMP/quality-tools"
          curl --fail --silent --show-error --location --retry 3 \
            -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --silent --show-error --location --retry 3 \
            -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP/quality-tools" >> "$GITHUB_PATH"
      - run: python3 scripts/secret_scan.py --history
      - run: python3 -m pip install -r scripts/admin-requirements.txt
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s ios -p 'test_*.py'
      - run: python3 -m pip install -r scripts/quality-requirements.txt
      - run: pip-audit -r scripts/admin-requirements.txt
      - run: pip-audit -r scripts/qr-identity-requirements.txt
      - run: ruff check . && ruff format --check .
      - run: node --check scripts/admin-static/invitation.js && node --check scripts/admin-static/dialog.js
      - run: yamllint -s .github compose*.yaml deploy tests/alert-rules.test.yaml .yamllint.yaml
      - run: actionlint -color
      - run: shellcheck .githooks/pre-commit .githooks/pre-push
      - run: dotnet restore Nephos.slnx --locked-mode
      - run: dotnet format Nephos.slnx --verify-no-changes --no-restore

  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore Nephos.slnx --locked-mode
      - run: dotnet build Nephos.slnx -c Release --no-restore
      - run: dotnet test Nephos.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
        env:
          OTEL_SDK_DISABLED: "true"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test the pinned identity provider
        run: mvn -B -q -f deploy/keycloak/pin-provider/pom.xml package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qr-provider
          path: deploy/keycloak/pin-provider/target/nephos-keycloak-pin-provider.jar
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: backend-test-results
          path: artifacts/test-results/*.trx
          retention-days: 7

  integration:
    name: Backend integration and recovery
    needs: [quality, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: compose.yaml:deploy/admin-qualification.compose.yaml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: python3 scripts/admin-tests.py
      - run: python3 scripts/dev-env.py
      - run: python3 scripts/admin-test-tls.py
      - name: Use the generated qualification trust bundle
        run: |
          {
            echo "SSL_CERT_FILE=$GITHUB_WORKSPACE/artifacts/admin-tls/trust.pem"
            echo "REQUESTS_CA_BUNDLE=$GITHUB_WORKSPACE/artifacts/admin-tls/trust.pem"
            echo "NEPHOS_QUALIFICATION_UID=$(id -u)"
            echo "NEPHOS_QUALIFICATION_GID=$(id -g)"
          } >> "$GITHUB_ENV"
      - name: Trust the disposable HTTPS fixture in Chromium
        run: |
          if ! command -v certutil >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libnss3-tools
          fi
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          certutil -A -d "sql:$HOME/.pki/nssdb" -n nephos-qualification \
            -t "C,," -i artifacts/admin-tls/ca.crt
      - run: docker compose config --quiet
      - run: docker compose run --rm --no-deps -v ./tests/alert-rules.test.yaml:/etc/prometheus/tests.yaml:ro --entrypoint promtool prometheus test rules /etc/prometheus/tests.yaml
      - run: docker compose up -d --build --quiet-pull
      - name: Require trusted HTTPS ingress readiness
        run: |
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-all-errors --retry-delay 2 --max-time 10 --cacert "$SSL_CERT_FILE" \
            https://localhost:18443/realms/nephos/.well-known/openid-configuration \
            --output /dev/null
      - run: python3 scripts/smoke.py
      - run: python3 scripts/admin-smoke.py
      - run: |
          python3 -m pip install -r scripts/browser-requirements.txt -r scripts/qr-identity-requirements.txt
          python3 -m playwright install --with-deps chromium
      - run: python3 scripts/admin-browser-smoke.py
      - run: python3 scripts/admin-ux-smoke.py
      - name: Administration session recovery
        run: |
          python3 scripts/admin-session-smoke.py \
            --console-container "$(docker compose ps -q admin-console)" \
            --session-container "$(docker compose ps -q admin-sessions)"
      - run: python3 scripts/passkey-smoke.py
      - run: python3 scripts/media-smoke.py
      - run: python3 scripts/release-smoke.py
      - run: python3 scripts/sharing-smoke.py
      - run: python3 scripts/operations-smoke.py
      - run: python3 scripts/edge-smoke.py
      - run: python3 scripts/identity-production-smoke.py
      - run: >-
          python3 scripts/qr-identity-qualification.py --image nephos-keycloak:26.8.1
          --postgres-image postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
      - run: python3 scripts/low-storage-smoke.py
      - run: python3 scripts/restore-smoke.py
      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=80
      - name: Stop development services
        if: always()
        run: docker compose down

  faces:
    name: Face models and real-photo integration
    needs: [quality, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: dotnet restore Nephos.slnx --locked-mode
      - name: Prepare real inference fixtures
        run: |
          python3 scripts/dev-env.py
          python3 scripts/faces-env.py
          python3 -m venv face-inference/.venv
          face-inference/.venv/bin/python -m pip install -r face-inference/requirements.txt
          python3 face-inference/download_models.py
          python3 face-inference/fixtures/download.py
          face-inference/.venv/bin/python face-inference/fixtures/generate_heic.py
          face-inference/.venv/bin/python face-inference/fixtures/download_camera.py
          face-inference/.venv/bin/python -m unittest discover -s face-inference -p 'test_*.py'
          face-inference/.venv/bin/python face-inference/fixtures/evaluate.py
          face-inference/.venv/bin/python face-inference/fixtures/evaluate_heic.py
      - name: Build and start optional face deployment
        run: |
          docker compose --env-file .env --env-file .env.faces \
            -f compose.yaml -f compose.faces.yaml -f deploy/faces/compose.test.yaml \
            up -d --build --quiet-pull
      - name: Repository, API and real-photo tests
        run: |
          python3 scripts/heic-upgrade-smoke.py
          python3 scripts/faces-tests.py
          python3 scripts/faces-smoke.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: face-integration-evidence
          path: artifacts/faces-live-smoke.json
          retention-days: 7
      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose --env-file .env --env-file .env.faces \
            -f compose.yaml -f compose.faces.yaml logs --no-color --tail=80
      - name: Stop face deployment
        if: always()
        run: |
          docker compose --env-file .env --env-file .env.faces \
            -f compose.yaml -f compose.faces.yaml -f deploy/faces/compose.test.yaml down

  ios:
    name: iOS lint, tests and simulator builds
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Swift formatting
        run: swift format lint --strict --recursive ios/Nephos ios/Tests ios/Qualification ios/Package.swift
      - name: Deterministic Swift tests
        working-directory: ios
        run: env -u NEPHOS_NATIVE_E2E -u NEPHOS_E2E_BEARER swift test --scratch-path .build
      - name: Signing-disabled simulator builds
        working-directory: ios
        run: |
          for configuration in Debug Release; do
            xcodebuild -quiet -project Nephos.xcodeproj -target Nephos \
              -configuration "$configuration" -sdk iphonesimulator \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/.derivedData/Build/Products/$configuration-iphonesimulator" \
              OBJROOT="$PWD/.derivedData/Build/Intermediates.noindex" \
              SYMROOT="$PWD/.derivedData/Build/Products" build
          done
      - name: Native backup retry and pause acceptance
        run: |
          simulator="$(xcrun simctl list devices available -j | jq -er '
            [.devices | to_entries[] | select(.key | contains("iOS"))
              | .value[] | select(.name | startswith("iPhone")) | .udid][0]')"
          xcrun simctl bootstatus "$simulator" -b
          python3 ios/onboarding_qualification.py --backup --simulator "$simulator"

  native-qr:
    name: Native QR real-service acceptance
    needs: [quality, backend]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: qr-provider
          path: artifacts/native-qr-input
      - name: Install real-service fixture dependencies
        run: |
          brew install openjdk@21 postgresql@17 caddy openssl@3
          java_home="$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          {
            echo "$java_home/bin"
            echo "$(brew --prefix postgresql@17)/bin"
            echo "$(brew --prefix openssl@3)/bin"
          } >> "$GITHUB_PATH"
          python3 -m venv artifacts/native-qr-input/venv
          artifacts/native-qr-input/venv/bin/pip install -r scripts/native-qr-ci-requirements.txt
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.tar.gz \
            --output artifacts/native-qr-input/keycloak.tar.gz
          tar -xzf artifacts/native-qr-input/keycloak.tar.gz -C artifacts/native-qr-input
      - name: Create disposable simulator
        run: |
          runtime="$(xcrun simctl list runtimes -j | jq -er \
            '[.runtimes[] | select(.isAvailable and (.identifier | contains("iOS")))][0].identifier')"
          device="$(xcrun simctl list devicetypes -j | jq -er \
            '[.devicetypes[] | select(.name | startswith("iPhone"))][0].identifier')"
          simulator="$(xcrun simctl create nephos-qr-ci "$device" "$runtime")"
          echo "QR_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - name: Qualify actual native QR and persistent session
        run: |
          artifacts/native-qr-input/venv/bin/python scripts/native-qr-ci.py \
            --simulator "$QR_SIMULATOR" \
            --keycloak-dist artifacts/native-qr-input/keycloak-26.8.1 \
            --provider-jar artifacts/native-qr-input/nephos-keycloak-pin-provider.jar
      - name: Remove disposable native fixture
        if: always()
        run: |
          if [ -n "${QR_SIMULATOR:-}" ]; then
            xcrun simctl shutdown "$QR_SIMULATOR" || true
            xcrun simctl delete "$QR_SIMULATOR"
          fi
          rm -rf artifacts/native-qr-ci artifacts/native-qr-input
