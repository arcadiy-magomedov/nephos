# Apply to a disposable base stack only; generate artifacts/admin-tls first.
services:
  keycloak:
    environment:
      KC_HOSTNAME: https://localhost:18443
      KC_PROXY_HEADERS: xforwarded
      NEPHOS_PUBLIC_ORIGIN: https://localhost:18443
  library-api:
    environment:
      Authentication__Authority: https://localhost:18443/realms/nephos
  library-worker:
    environment:
      Authentication__Authority: https://localhost:18443/realms/nephos
  library-admin:
    environment:
      Authentication__Authority: https://localhost:18443/realms/nephos
  storage-api:
    environment:
      Authentication__Authority: https://localhost:18443/realms/nephos
  storage-worker:
    environment:
      Authentication__Authority: https://localhost:18443/realms/nephos
  qualification-edge:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "${NEPHOS_QUALIFICATION_UID:-0}:${NEPHOS_QUALIFICATION_GID:-0}"
    ports: ["127.0.0.1:18443:8443"]
    volumes:
      - ./deploy/admin-qualification.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./artifacts/admin-tls:/etc/nephos:ro
    read_only: true
    tmpfs: ["/data", "/config"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
