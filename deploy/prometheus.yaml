global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: collector-internal
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
