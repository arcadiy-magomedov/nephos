resolver 127.0.0.11 valid=5s ipv6=off;
upstream library_backend {
    zone library_backend 64k;
    server library-api:8080 resolve;
}
upstream storage_backend {
    zone storage_backend 64k;
    server storage-api:8080 resolve;
}
upstream faces_backend {
    zone faces_backend 64k;
    server faces-api:8080 resolve;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 4m;

    location /v1/libraries {
        proxy_pass http://library_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /v1/config { proxy_pass http://library_backend; }
    location /v1/users { proxy_pass http://library_backend; }
    location /v1/shares { proxy_pass http://library_backend; }
    location /v1/devices { proxy_pass http://library_backend; }
    location = /v1/trash { proxy_pass http://library_backend; }
    location /v1/trash/ { proxy_pass http://library_backend; }
    location = /v1/analysis/access { proxy_pass http://library_backend; }
    location /v1/faces/ {
        proxy_pass http://faces_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v1/assets/ {
        proxy_pass http://library_backend;
        proxy_buffering off;
    }
    location /v1/resource-sets/ {
        proxy_pass http://library_backend;
        proxy_read_timeout 180s;
    }
    location /v1/uploads {
        proxy_pass http://storage_backend;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
    }
    location = /health/library {
        proxy_pass http://library_backend/health/ready;
        access_log off;
    }
    location = /health/storage {
        proxy_pass http://storage_backend/health/ready;
        access_log off;
    }
    location / { return 404; }
}
