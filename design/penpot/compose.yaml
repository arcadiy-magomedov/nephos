name: nephos-design

x-config: &config
  PENPOT_PUBLIC_URI: http://localhost:9001
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Run bootstrap.py}
  PENPOT_FLAGS: disable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies enable-prepl-server disable-telemetry enable-mcp

x-database: &database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD:?Run bootstrap.py}

services:
  penpot-frontend:
    image: penpotapp/frontend@sha256:80f0baff19a275c5aee54956e9c44cce80cb7c0488bb8f27d92df7fe4f100a78
    restart: unless-stopped
    ports: ["127.0.0.1:9001:8080"]
    environment:
      <<: *config
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
    volumes: ["./.data/assets:/opt/data/assets:ro"]
    depends_on: [penpot-backend, penpot-admin-console, penpot-exporter, penpot-mcp]
  penpot-backend:
    image: penpotapp/backend@sha256:121472d0ab4a9bdf450884159bde28805027022a230d14c8f3907c316623aea8
    restart: unless-stopped
    environment:
      <<: [*config, *database]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:MaxDirectMemorySize=128m
    volumes: ["./.data/assets:/opt/data/assets"]
    depends_on:
      penpot-postgres: {condition: service_healthy}
      penpot-valkey: {condition: service_healthy}
  penpot-admin-console:
    image: penpotapp/admin-console@sha256:9b4cd6d0dc1b7f4cfbfe2a188b2a63989cc2b9886db0905dec545ef189084265
    restart: unless-stopped
    environment:
      <<: [*config, *database]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
    depends_on:
      penpot-postgres: {condition: service_healthy}
  penpot-exporter:
    image: penpotapp/exporter@sha256:85f1d6eff14b49a131b4245dc3000aa738ac48ca103f1d3aa12228d7473544c0
    restart: unless-stopped
    environment:
      <<: *config
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    depends_on:
      penpot-valkey: {condition: service_healthy}
  penpot-mcp:
    image: penpotapp/mcp@sha256:08292a1e3b6e0993a6eae8f6b6f5cdce6aa69023327511400b3dc8dd0f69c8fa
    restart: unless-stopped
  penpot-postgres:
    image: postgres:15.15-alpine
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${PENPOT_DATABASE_PASSWORD:?Run bootstrap.py}
    volumes: ["./.data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "penpot"]
      interval: 2s
      timeout: 5s
      retries: 30
  penpot-valkey:
    image: valkey/valkey:8.1.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
